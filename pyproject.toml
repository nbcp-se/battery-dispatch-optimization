[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-dispatch"
version = "0.1.0"
description = "Battery dispatch across half-hourly and hourly electricity markets"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.6", "scipy==1.14.1", "openpyxl==3.1.5"]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[project.scripts]
battery-dispatch = "battery_dispatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
